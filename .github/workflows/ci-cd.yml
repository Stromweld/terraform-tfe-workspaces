---
on:
  pull_request:

jobs:
  markdown-lint:
    uses: Stromweld/github-workflows/.github/workflows/markdown-lint.yml@main

  yaml-lint:
    uses: Stromweld/github-workflows/.github/workflows/yaml-lint.yml@main

  json-lint:
    uses: Stromweld/github-workflows/.github/workflows/json-lint.yml@main

  terraforml-int:
    uses: Stromweld/github-workflows/.github/workflows/terraform-lint.yml@main
    secrets: inherit

  check:
    if: always()
    needs:
      - markdownlint
      - yamllint
      - jsonlint
      - terraformlint
    runs-on: Ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@main
        with:
          allowed-failures:
          allowed-skips:
          jobs: ${{ toJSON(needs) }}
